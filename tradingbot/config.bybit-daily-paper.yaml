# =============================================================================
# DAILY PAPER PRE-FLIGHT — Bybit MAINNET data, SIMULATED fills (dry_run).
# -----------------------------------------------------------------------------
# Purpose: the September dress rehearsal. Runs the EXACT production strategy,
# sleeve sizes, risk gates and kill switch of config.bybit-live.yaml — but is
# hard-wired to PAPER so it can run safely on ANY host (incl. the current
# non-UK sandbox box) with zero chance of placing a real order.
#
# >>> DO NOT set app.dry_run = false in this file. <<<
# Going live is done from config.bybit-live.yaml, on a UK/EU host, only.
# This file exists precisely so the real-money config never sits "armed" on a
# box whose IP could get the account frozen.
#
# Expect it to be QUIET: a 50-day daily strategy fires ~1-2 trades/month across
# the whole basket, so days with no trades are correct — the point is a clean,
# error-free run of the production config on live data before launch.
# =============================================================================

exchange:
  name: bybit
  sandbox: false
  quote_currency: USDT
  symbols_allowlist:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
    - ADA/USDT
    - AVAX/USDT
    - DOGE/USDT
    - TRX/USDT
  enable_rate_limit: true
  request_timeout_ms: 20000
  use_threaded_dns: true
  options:
    defaultType: spot

# Identical hard risk layer to the live config (~180 USDT / 7 sleeves).
risk:
  floor_quote: 10.0
  floor_buffer_quote: 5.0
  min_notional_per_trade_quote: 5.0
  max_notional_per_trade_quote: 26.0
  max_notional_per_trade_pct_equity: 15.0
  per_trade_risk_pct: 15.0
  max_open_positions: 7
  max_concurrent_open_orders: 8
  max_trades_per_day: 14
  max_daily_traded_notional_quote: 180.0
  max_daily_loss_quote: 25.0
  daily_reset_utc_hour: 0

fees:
  maker_fee_pct: 0.10
  taker_fee_pct: 0.10
  pull_fee_tiers_from_exchange: true
  round_trip_fee_safety_margin_pct: 0.20
  maker_first: true
  allow_taker_fallback: true
  maker_offset_pct: 0.05
  max_spread_pct: 0.30
  max_slippage_pct: 0.20
  require_take_profit: false

# The validated strategy — daily Donchian breakout (identical to live).
strategy:
  name: donchian_breakout
  timeframe: 1d
  ohlcv_limit: 120
  target_notional_quote: 23.0
  take_profit_pct: 1.5
  stop_loss_pct: 1.0
  vwap_filter_enabled: false
  donchian_entry_period: 50
  donchian_exit_period: 15
  trend_filter_enabled: false
  signal_on_closed_bar: true

events:
  enabled: true
  timezone: UTC
  pre_event_window_minutes: 60
  post_event_window_minutes: 30
  pause_entries: true
  reduce_size_pct: 50.0
  widen_maker_offset_pct: 0.10
  tighten_stops: true
  calendar: []
  calendar_csv: ""
  include_halvings: true

# Kill switch tuned for DAILY bars (same as live). REVIEW after this pre-flight.
kill_switch:
  enabled: true
  rolling_window_minutes: 30
  price_velocity_ratio: 5.0
  volume_spike_ratio: 8.0
  cooldown_minutes: 1440
  pull_resting_orders: true

regime:
  enabled: false
funding:
  enabled: false
mvrv:
  enabled: false

learning:
  enabled: true
  bad_trades_dir: bad_trades
  weekly: true
  min_trades_per_bucket: 5
  write_own_losers: true

telegram:
  enabled: true
  approval_threshold_quote: 0.0
  approval_timeout_seconds: 300
  allowed_chat_ids: []              # add [8993718883] on the UK/EU host (Telegram API is blocked
                                    # from the current RU-cloud box, so keep empty until migration)

reporting:
  weekly_enabled: true
  weekly_day: 0
  weekly_hour_utc: 8
  email_enabled: false

app:
  dry_run: true                     # PAPER — locked. Do NOT flip on this host.
  paper_equity: 180.0               # sizes the paper run (real wallet is ignored in dry-run)
  trading_enabled: true
  log_level: INFO
  log_json: false
  log_file: "data/daily_paper.log"
  log_file_max_bytes: 5000000
  log_file_backups: 5
  db_url: "sqlite:///data/tradingbot_daily_paper.db"   # SEPARATE from live + test-active
  heartbeat_interval_seconds: 3600  # hourly poll — ample for a daily strategy
  max_api_latency_ms: 3000
  max_consecutive_failures: 3
  health_recovery_samples: 3
  cancel_orders_on_suspend: true
